name: R CI

on:
  pull_request:
    paths:
      - "R/**"
      - "tests/**"
      - "templates/**"
      - "scripts/**"
      - "registry/**"
      - "web/**"
      - ".lintr"
      - ".github/workflows/r-ci.yml"

jobs:
  guard-deposits:
    name: Guard the deposits are untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The directory name comes from the config rather than being spelled
      # here, so pointing this repo at another study needs no CI edit.
      - name: Fail if this PR touches the deposits
        run: |
          ROOT=$(python3 -c "import tomllib;print(tomllib.load(open('web/dataset.toml','rb'))['dataset']['root'])")
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- "$ROOT/")
          if [ -n "$CHANGED" ]; then
            echo "::error::This PR modifies files under $ROOT/, which must stay read-only:"
            echo "$CHANGED"
            exit 1
          fi

  format-lint-test:
    name: Format, lint, and test (synthetic data only)
    runs-on: ubuntu-latest
    needs: guard-deposits
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install dependencies
        run: install.packages(c("styler", "lintr", "testthat"))
        shell: Rscript {0}
      - name: Check formatting (styler)
        run: |
          styler::cache_deactivate()
          changed <- styler::style_dir("R", dry = "fail")
          changed2 <- styler::style_dir("tests", dry = "fail")
        shell: Rscript {0}
      - name: Lint (lintr)
        run: |
          lints <- c(lintr::lint_dir("R"), lintr::lint_dir("tests"))
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: Run tests (synthetic fixtures only - no real data exists in this repo)
        run: testthat::test_dir("tests/testthat")
        shell: Rscript {0}

  # The atlas and the assistant. Standard library only, so there is nothing
  # to install - which is also what this job quietly checks: if a dependency
  # ever crept into web/, this is where it fails.
  web-tests:
    name: Atlas and assistant tests (no install)
    runs-on: ubuntu-latest
    needs: guard-deposits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python3 -m unittest discover -s web/tests -v

  registry-up-to-date:
    name: Registry matches R/variables/*/*/*.R
    runs-on: ubuntu-latest
    needs: guard-deposits
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install dependencies
        run: install.packages("jsonlite")
        shell: Rscript {0}
      - name: Regenerate registry
        run: Rscript scripts/build_registry.R
      - name: Fail if registry/ now differs from what's committed
        run: |
          if ! git diff --exit-code --stat registry/; then
            echo "::error::registry/ is out of date - run 'Rscript scripts/build_registry.R' and commit the result."
            exit 1
          fi
